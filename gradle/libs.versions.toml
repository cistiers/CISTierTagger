[versions]
minecraft     = "26.1"
loader        = "0.19.3"
fabric-api    = "0.145.1+26.1"
loom          = "1.17.16"
lombok        = "1.18.46"
annotations   = "26.1.0"
modmenu       = "18.0.0"
junit         = "5.13.4"

[libraries]
minecraft       = { group = "com.mojang",                name = "minecraft",                     version.ref = "minecraft"   }
fabric-loader   = { group = "net.fabricmc",              name = "fabric-loader",                 version.ref = "loader"      }
fabric-api      = { group = "net.fabricmc.fabric-api",   name = "fabric-api",                    version.ref = "fabric-api"  }
lombok          = { group = "org.projectlombok",         name = "lombok",                        version.ref = "lombok"      }
annotations     = { group = "org.jetbrains",             name = "annotations",                   version.ref = "annotations" }
modmenu         = { group = "maven.modrinth",            name = "modmenu",                       version.ref = "modmenu"     }
junit-bom       = { group = "org.junit",                 name = "junit-bom",                     version.ref = "junit"       }
junit-jupiter   = { group = "org.junit.jupiter",         name = "junit-jupiter"                                              }
junit-launcher  = { group = "org.junit.platform",        name = "junit-platform-launcher"                                    }

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
