name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - name: Build all targets
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
          ./gradlew clean build --no-daemon --max-workers=2

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: cistiertagger-${{ github.sha }}
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          if-no-files-found: error
