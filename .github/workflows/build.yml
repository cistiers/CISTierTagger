name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Artifact name
        id: meta
        run: echo "name=cistiertagger-$(git rev-parse --short HEAD)+${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }} # cistiertagger-{gitHash}+{branch}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
