name: release

run-name: ${{ inputs.version }}${{ inputs.dry_run && ' (build only)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mod version"
        required: true
      versions:
        description: "Minecraft targets to publish, space/comma separated (empty = all)"
        required: false
        default: ""
      changelog:
        description: "Changelog (markdown)"
        required: false
        default: ""
      release_type:
        description: "Release channel"
        type: choice
        options: [release, beta, alpha]
        default: release
      publish_modrinth:
        description: "Modrinth"
        type: boolean
        default: true
      publish_curseforge:
        description: "CurseForge"
        type: boolean
        default: true
      publish_github:
        description: "GitHub Releases"
        type: boolean
        default: true
      dry_run:
        description: "Build only, do not publish"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.version }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      changelog: ${{ steps.changelog.outputs.text }}
    steps:
      - uses: actions/checkout@v4

      - name: Format changelog
        id: changelog
        env:
          RAW_CHANGELOG: ${{ inputs.changelog }}
        run: |
          CHANGELOG="${RAW_CHANGELOG//\\n/$'\n'}"
          DELIMITER="changelog-$(openssl rand -hex 16)"
          {
            echo "text<<${DELIMITER}"
            printf '%s\n' "$CHANGELOG"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Build matrix from selection
        id: gen
        env:
          SELECTED: ${{ inputs.versions }}
        run: python3 scripts/release_matrix.py

  build:
    name: build ${{ matrix.mc }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - name: Build
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
          chmod +x gradlew
          ./gradlew :${{ matrix.mc }}:build --configure-on-demand --no-daemon -Pmod.version=${{ inputs.version }}

      - name: Stage jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: |
            versions/${{ matrix.mc }}/build/libs/*.jar
            !versions/${{ matrix.mc }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: GitHub release
    needs: [setup, build]
    if: ${{ !inputs.dry_run && inputs.publish_github }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Compose release notes
        id: notes
        env:
          CHANGELOG: ${{ needs.setup.outputs.changelog }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          DELIMITER="notes-$(openssl rand -hex 16)"
          PREV=$(git tag --sort=-creatordate --list 'v*' | grep -v -x "v${VERSION}" | head -1 || true)
          {
            echo "body<<${DELIMITER}"
            printf '%s\n' "$CHANGELOG"
            echo ""
            if [ -n "$PREV" ]; then
              echo "Full Changelog: https://github.com/${REPO}/compare/${PREV}...v${VERSION}"
            else
              echo "Full Changelog: https://github.com/${REPO}/commits/v${VERSION}"
            fi
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jar-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            || echo "release v${VERSION} already exists"

      - name: Upload jars to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "v${VERSION}" dist/*.jar --clobber --repo "${{ github.repository }}"

  publish:
    name: publish ${{ matrix.mc }}
    needs: [setup, build, create-release]
    if: ${{ always() && needs.setup.result == 'success' && needs.build.result == 'success' && !inputs.dry_run && (inputs.publish_modrinth || inputs.publish_curseforge) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs

      - name: Format game versions
        id: gv
        run: |
          {
            echo "versions<<EOF"
            echo "${{ matrix.game_versions }}" | tr ' ' '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: cistiertagger
          modrinth-token: ${{ inputs.publish_modrinth && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ inputs.publish_curseforge && secrets.CURSEFORGE_TOKEN || '' }}
          files: build/libs/!(*-sources).jar
          name: "CISTierTagger ${{ inputs.version }} (MC ${{ matrix.mc }})"
          version: "${{ inputs.version }}+${{ matrix.mc }}"
          version-type: ${{ inputs.release_type }}
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.gv.outputs.versions }}
          game-version-filter: none
          dependencies: |
            fabric-api(required)
            modmenu(optional)
          java: ${{ matrix.java }}
          retry-attempts: 3
          fail-mode: warn
          changelog: ${{ needs.setup.outputs.changelog }}

  collect:
    name: bundle
    needs: [build, publish]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jar-*
          merge-multiple: true

      - name: Bundle into one archive
        uses: actions/upload-artifact@v4
        with:
          name: cistiertagger-${{ inputs.version }}
          path: dist
          if-no-files-found: error

      - name: Remove per-target artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            -q '.artifacts[] | select(.name | startswith("jar-")) | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted jar artifact $id"
            done